; GInputNext v11
; Shared configuration for GTA III, GTA Vice City and GTA San Andreas.
; Keep beside GInputNext.asi, including inside Mod Loader/scripts.

[Core]
Enabled=1
ControllerIndex=0
AllowGenericDirectInput=1
SuppressNativeGamepad=1

; Classic PC III/VC/SA do not reliably wire the logical Start field
; to the retail PC pause frontend. Preserve Start for scripts and also
; synthesize the normal PC ESC edge so Start/Options pauses/resumes.
StartActsAsEscape=1
BackgroundInput=0
HotplugScanFrames=30
DebugInput=0

[Sticks]
LeftInnerDeadzone=0.15
RightInnerDeadzone=0.12
OuterDeadzone=0.02
LeftSensitivity=1.00
RightSensitivity=1.00
; General third-person / vehicle / free-look camera vertical direction.
; 1 flips SDL's right-stick Y before GTA receives it.
InvertCameraY=1

; Weapon-target / first-person aiming vertical direction.
; This is selected instead of InvertCameraY while Target is held, so enabling
; both does not cause a double inversion.
InvertAimY=1

[Gameplay]
; Enable classic console-style lock-on when the logical Target button is held.
; This is the inverse of old GInput's FreeAim=1 behavior.
AutoAim=1

[Gyro]
Enabled=0
Sensitivity=0.35
InvertX=0
InvertY=0

[Rumble]
Enabled=1
MirrorGameRumble=1
Strength=1.00

[GenericDirectInput]
; FALLBACK ONLY. SDL GameControllerDB and built-in known-device mappings are
; tried first.
;
; Common PlayStation-position DirectInput layout:
; b0 Square, b1 Cross, b2 Circle, b3 Triangle
; b4 L1, b5 R1, b6 L2, b7 R2
; b8 Select, b9 Start, b10 L3, b11 R3, b12 Guide/Home

LeftX=0
LeftY=1
RightX=2
RightY=3

LeftTriggerAxis=-1
RightTriggerAxis=-1
LeftTriggerButton=6
RightTriggerButton=7
CenteredTriggerAxes=1

A=1
B=2
X=0
Y=3
LB=4
RB=5
Back=8
Start=9
L3=10
R3=11
Guide=12
Misc1=-1
Hat=0
